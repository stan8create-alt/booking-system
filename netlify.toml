[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."ops-detect-scheduled"]
  # every 2 hours, Monday to Friday only (nobody works at the weekend). Netlify cron runs on UTC days.
  schedule = "0 */2 * * 1-5"

[[redirects]]
  from = "/ops"
  to = "/ops.html"
  status = 200

[[redirects]]
  from = "/ops-new"
  to = "/ops-new.html"
  status = 200
